# Logstash 8.19.20; no active ECS normalisation or field transformations.
input {
  file {
    path => "${WAZUH_ALERTS_PATH}"
    codec => json { ecs_compatibility => "disabled" }
    ecs_compatibility => "disabled"
    type => "wazuh-alerts"
    start_position => "end"
    sincedb_path => "/var/lib/logstash/plugins/inputs/file/sincedb_wazuh"
  }
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_URL}"]
    index => "wazuh-alerts-4.x-%{+YYYY.MM.dd}"
    user => "${ELASTICSEARCH_USERNAME}"
    password => "${ELASTICSEARCH_PASSWORD}"
    ssl_enabled => true
    ssl_certificate_authorities => ["${ELASTICSEARCH_CA_PATH}"]
    ssl_verification_mode => "full"
    ecs_compatibility => "disabled"
    ilm_enabled => false
    data_stream => false
    manage_template => false
  }
}
